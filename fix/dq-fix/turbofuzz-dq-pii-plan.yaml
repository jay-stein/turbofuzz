      - "advisoryOnly=true and scoreVersion 1 keep the old band exactly."
      - "Record as decision D7 (owner decision: thresholds and wording)."
    done_when: "Titanic reads fair with the Cabin reason; HR and cafe no longer read good; clean datasets (penguins, tips, airquality) keep good; thresholds unit-tested and documented."

  - id: OPT
