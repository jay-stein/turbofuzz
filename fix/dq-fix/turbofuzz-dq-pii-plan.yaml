      - "Cabin-style codes with legitimate multi-value forms (C23 C25 C27) are reviewed, not failed."
      - "Formula-like check (score.ts, suggestion kind formula): only flag a leading minus or plus when the value looks like an arithmetic expression or function call, never for ISO 8601 durations (-P1D), negative numbers, dates, or codes."
    done_when: "GDPR picture and source and police name no longer appear in the fix ranking; Titanic Cabin multi-cabin values are review at most; format issues on genuine code columns (for example a phone column with one odd value) still appear."

  - id: FTX
    title: Embedded PII in free-text columns
    priority: P1
    depends_on: [T1, T2]
    files_touched: [src/data/sensitivity.ts, src/worker/search.worker.ts, test/sensitivity-freetext.test.ts]
