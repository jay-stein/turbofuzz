  - id: MEASURE
    title: Separate intended type from conformance; exact counts; one count per bad cell
    priority: P0
    depends_on: [BENCH-REAL]
    files_touched: [src/parse/infer.ts, src/data/column.ts, src/data/suggestions.ts, src/data/score.ts, src/worker/search.worker.ts, test/measure.test.ts]
    do:
      - "Infer an INTENDED type from the majority of non-null values (for example at least 60% fit the type) and keep the storage decision separate. A Quantity column with 12% ERROR is an integer column with 619 non-conforming cells, never a category that hides them."
      - "Keep sampling for speed of type inference only. Count conforming and non-conforming cells for the intended type in one exact pass over all rows (the pattern profile already does a full pass, so cost is comparable). Label any count that is still sampled with 'sampled' and scale nothing silently."
      - "Each non-conforming cell is counted once per column. 'Stored as text' becomes a property of the column shown in the evidence line, not a second failing check over the same cells."
      - "Category inference (12 or fewer distinct values) must not apply when the non-conforming values are the only thing making the column non-numeric."
      - "Keep Convert actions, but they use the exact non-conforming count and go through SAFE."
    done_when: "Two property tests pass: (1) on a clean numeric column, injecting more junk never raises the score or lowers the failure count (0 to 20% in 1% steps, integer and decimal); (2) reported counts equal exact counts on the cafe file (Price Per Unit 420). Cafe Item, Quantity, Payment Method and Location report their ERROR cells. No double counting in Transaction Date. Load-time budget in constraints.performance still met."

  - id: SEM
    title: One semantic type per column, shared by every detector
    priority: P0
    depends_on: [H0, MEASURE]
    files_touched: [src/data/semantic-type.ts (new), src/data/identifier.ts, src/data/name-hints.ts, src/data/text-profile.ts, src/data/mask-profile.ts, src/data/score.ts, src/search/similar.ts, test/semantic-type.test.ts]
    do:
      - "Compute once per column from values plus name hints: identifier, phone, email, person name, address, geo coordinate, URL, free text, code, money, date or datetime, duration, category, measure. Store it in ColumnMeta with a confidence and the reason."
      - "Consumers read it instead of re-deciding: Convert offers (never for identifier, phone, code), PII classes, format masks (skip URL, free text, person name), similarity clustering (skip date, identifier, numeric), outlier and chart code (replace scattered isLikelyIdentifierColumn calls)."
      - "Fix the PII shape order in text-profile.ts so date-like values are classified before phone, and do not run TFN, ABN or ACN checksums on values that parse as dates."
      - "The user can override the semantic type per column; the override is a Recipe step."
    done_when: "On the corpus: Ticket, mobile and USUBJID get no Convert offer and no Phone flag; ISO dates are never Phone or TFN; GDPR picture and police name get no format failure; no similarity clusters on date columns; existing outlier and chart behaviour unchanged (tests stay green)."

  - id: WIRE
    title: One issue list feeding the score
    priority: P0
    depends_on: [MEASURE]
    files_touched: [src/data/score.ts, src/data/findings.ts, src/ui/app.ts (advanced signals), src/ui/quality-page.ts, test/findings.test.ts, test/score.test.ts]
    do:
      - "Make one function produce every column issue (placeholders stored as text, type conflicts, pattern failures, spelling clusters, sentinels, numbers or dates stored as text, keys, constants) with severity fix, review or info. Either extend qualityFindings and call it, or fold it into score.ts; delete the unused path."
      - "Score from that list: deterministic issues (type conflicts, placeholders, case and whitespace spelling clusters) count toward validity or consistency; fuzzy clusters and sentinels are review; advisory items are info."
      - "Advanced signals keep only advisory, dataset-level signals (co-missingness, drift, text profiles). Spelling clusters move into the main issue list."
      - "Toolbar chips read the same list so counts agree everywhere."
    done_when: "HR department FINANCE/finance/Finance appears in the main issue list and the score; counts on the toolbar, the issue list and the checks table agree on every corpus file; no detector result is shown only in Advanced signals unless it is advisory."

  - id: QUICK
    title: Local detector and parser fixes
    priority: P0
    depends_on: [BENCH-REAL]
    files_touched: [src/parse/header-detect.ts, src/parse/null-tokens.ts, src/parse/dates.ts, src/data/text-profile.ts, src/data/formula.ts, src/data/score.ts, src/search/similar.ts]
    do:
      - "Header: when no row scores as a header and rows are type-consistent, return a header-less table (col_1..col_N) instead of consuming the first record (see HDR)."
      - "Null tokens: add error and its compact forms; keep the user-editable policy."
      - "Dates: parse dd-Mon-yyyy and d-Mon-yy (18-Jun-1996)."
      - "Formula: keep looksLikeFormula for export escaping, but do not count it as a validity failure; at most an info note. Never flag ISO 8601 durations (-P1D)."
      - "Similarity: skip date and numeric-looking columns."
    done_when: "Pima keeps 768 rows; cafe ERROR counted as missing; HR date_of_birth parses all three forms; face_vaccine no longer fair because of -P1D; HR date_of_birth shows no similarity clusters."

  - id: SAFE
    title: Identifier-safe conversions and fix guardrails
    priority: P0
    depends_on: [T0]
    files_touched: [src/parse/infer.ts and src/data/column.ts (where typeDowngrade is produced), src/data/identifier.ts (reuse looksLikeIdName and isLikelyIdentifierColumn, which today only guard outliers and charts), src/data/score.ts (downgrade check, line ~176), src/ui/quality-page.ts, test/safe-conversion.test.ts]
    do:
      - "Never suggest Convert to Integer or Number for a column that looks like an identifier: name hints (id, code, ticket, number as in phone, mobile, account, zip, postcode), leading zeros, mixed alphanumeric values, fixed-width digit strings, phone-like or checksum-valid values, or a column where the blocked share exceeds 10%. Offer 'keep as text' or 'mark as identifier' instead."
      - "Any type-conversion fix must show how many values it would lose or change, and is refused (disabled with reason) when it would null more than 1% of non-empty values unless the user confirms."
      - "A conversion that would drop leading zeros or change digits is refused outright."
      - "Remove the +pts claim from refused conversions so they cannot lead the ranking."
    done_when: "Titanic Ticket and HR mobile show no Convert action; a genuine mixed-type numeric column (for example chipotle item_price after currency stripping) still offers one; unit tests cover leading zeros, phone shapes and the 1% threshold."

  - id: BAND
