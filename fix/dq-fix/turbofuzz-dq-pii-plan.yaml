      - "Post-fix state: after Fix top 3 or any Apply, the card shows 'Applied - Undo' with the points gained, the score animates once (not under reduced motion), the card moves to a 'Fixed this session' group at the bottom, and the Recipe step is visible. Undo restores the card and score."
