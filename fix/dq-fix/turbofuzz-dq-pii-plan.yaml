      - "Include address and coordinate hints in H0 (street address, lat, lon, latitude, longitude, location, postcode) and personal-name columns, DOB and salary as classes in T1, all advisory."
    done_when: "HR notes reports embedded card and phone numbers (about 777 rows in the seeded file); police streetaddress, name and latitude/longitude flagged as possibly sensitive; no new false positives on the 11-dataset corpus."

  - id: DUPK
    title: Near-duplicates ignoring key columns
    priority: P1
    depends_on: [T6]
    files_touched: [src/data/key-duplicates.ts (exists; extend or reuse), src/data/score.ts (uniqueness check), src/worker/search.worker.ts, src/ui/quality-page.ts, test/near-duplicates.test.ts]
    do:
      - "Detect columns that are unique per row (ids, row numbers) and offer 'duplicates ignoring id' as a review item: group rows equal on all other columns, show counts and a preview. Exact-duplicate check stays as it is."
      - "Use column subsets only from the user's choice or the detected id columns; no combinatorial search."
    done_when: "GDPR reports 16 repeated rows when ignoring id (review, with a Show duplicates action); datasets without an id column are unaffected."

  - id: BENCH-REAL
    title: Real-world regression corpus (runs in npm test, no network, no nightly job)
    priority: P0
    depends_on: [T0]
    files_touched: [test/fixtures/real-world/ (new, one folder per dataset), test/real-world.test.ts, test/e2e/real-world.spec.ts, scripts/corpus-add.mjs (new)]
    do:
      - "Layout: test/fixtures/real-world/<name>/data.csv (trimmed to at most 300 rows, keeping the messy rows), expect.json, SOURCE.md (origin and licence). Tests never download anything."
      - "Initial corpus: the 11 datasets already tested (titanic, penguins, pima, chipotle, tips, airquality, coffee ratings, US police killings, GDPR fines, plus the two seeded synthetic generators) and 10 to 20 messy files supplied by the owner."
      - "expect.json has three lists: must_flag (issue kind, column, approximate count), must_not_flag (false positives, for example 'no sensitive flag on Ticket', 'no Convert action on mobile'), and band (expected score band or range). Keep each list short and specific."
      - "Add the pilot false positives as must_not_flag cases: USUBJID not Phone/TFN/ACN; height and depth not Phone; -P1D not formula-like; fully empty column is one drop-column item, not +40 pts."
      - "scripts/corpus-add.mjs <file.csv>: trims the file, runs the profiler, and writes a DRAFT expect.json listing what the app currently flags, so the owner only edits it to say which flags are right and what is missing."
      - "test/real-world.test.ts runs every folder through the pure profiling and scoring modules (no browser) and fails on any expect.json violation; the e2e spec loads each file in the page and fails on console errors."
    done_when: "All corpus folders pass in npm test; adding a dataset is one corpus-add command plus a short edit of its expect.json; the 11 initial datasets and the pilot must_not_flag cases are included."
    owner_input: "Send 10-20 messy files (CSV, TSV or XLSX under 5 MB each) you are allowed to share; say which ones contain real personal data so they are not committed."

  - id: E1
    title: Exception export (row-level)
    priority: P1
    depends_on: [T6, T7, T8]
    files_touched: [src/ui/quality-page.ts, src/ui/export-panel.ts, src/data/dq-report.ts, src/worker/search.worker.ts]
    do:
      - "Download exceptions.csv: one row per failing cell with source row number, column, check id, dimension, severity, value and reason. Per check and for all checks."
      - Values for sensitive-flagged columns are masked by default, with an explicit "include raw values" switch. Stream from the worker; warn above 100k rows.
    done_when: Exceptions for B match the check counts exactly (unit-tested); sensitive values masked by default; 250k-row export stays within the budget.

  - id: R1
    title: Rule recommender and rule editor
    priority: P1
    depends_on: [C1]
    files_new: [src/data/rules.ts, test/rules.test.ts]
    files_touched: [src/data/score.ts, src/ui/quality-page.ts]
    do:
      - "Recommend rules from the profile: not null when complete, unique for key-like columns, range from percentiles with a margin, allowed values when distinct <= 20 and they cover >= 99%, dominant format when mask share >= 95%, pair rules from name pairs."
      - "Editor with safe rule types only (not null, unique, range, in-list, regex, length, cross-column comparison). No eval, no new Function; a rule is data interpreted by a pure evaluator. Per-rule severity (critical, major, minor) and an allowed-failure threshold (for example 0.5%)."
      - Accepted rules become scored checks (D1) and appear in the Issues tab.
    done_when: On a clean fixture the recommender proposes a sensible set with zero false failures; on B recommended rules surface the planted problems; rules evaluate in <= 300 ms on 250k rows.

  - id: R2
    title: Rules file, replay on re-load, pipeline export
    priority: P1
    depends_on: [R1]
    files_touched: [src/data/rules.ts, src/data/recipe.ts, src/data/dq-report.ts, src/ui/quality-page.ts]
    do:
      - "Download and upload turbofuzz-rules.json (versioned). Store a schema fingerprint (column names + types). On loading a file with the same fingerprint, offer Apply saved rules?"
      - Extend emitDQChecks (sodacl, dbt, gx, dqdl) to cover the new rule types; list untranslatable rules in `support`.
    done_when: Round-trip test; loading the same schema re-applies rules with one click; emitted checks validated against the formats' documented syntax.

  - id: REF
    title: Bundled reference data and semantic types (Accuracy offline)
    priority: P2
    depends_on: [T1, R1]
    files_new: [src/data/reference/*.ts, src/data/semantic-types.ts, test/reference.test.ts]
    do:
      - "Lazy dynamic-import modules (NOT fetch): ISO 3166 countries with common aliases, ISO 4217 currencies, AU states and territories, AU postcode to state ranges, US states, weekdays and months, boolean words. Total <= 25 KB gz."
      - "Semantic type per column (Email, Phone AU, Postcode, Country, Currency, URL, UUID, IP, Date of birth, Name, Gender...), user-overridable, shared with sensitivity and validity."
      - "Values outside a recognised reference list become Accuracy checks (3 values are not valid countries, e.g. Austrlia; did you mean Australia?) using the existing Jaro-Winkler matcher for suggestions. Accuracy stays weight 0 by default but becomes applicable."
    done_when: Chunks load only on demand; Accuracy no longer n/a for recognised columns; no network request (B7).

  - id: S1
    title: Local history, trend and schema drift
    priority: P1
    depends_on: [C1, R1]
    files_new: [src/data/history.ts, test/history.test.ts]
    files_touched: [src/ui/quality-page.ts, src/ui/app.ts]
    do:
      - "Per D5: IndexedDB snapshots keyed by schema fingerprint: timestamp, row count, per-column fill rate and distinct count, dataset and dimension scores, rule pass rates, schema. Never values or examples."
      - "History tab: score trend sparkline; compared with your previous load diff: columns added/removed/retyped, fill-rate shifts over a threshold, new categories (labels only for low-cardinality non-sensitive columns), row-count change."
      - First-run note, a settings switch and a one-click Clear history.
    done_when: Two consecutive loads of B with a changed copy show the drift correctly; clearing history empties IndexedDB; sensitive columns never store labels (unit-tested); works when IndexedDB is blocked (feature simply hides).

  - id: BENCH-PII
    title: PII accuracy benchmark with a labelled corpus
    priority: P0
    depends_on: [T1]
    files_new: [test/fixtures/pii-corpus.ts, test/pii-benchmark.test.ts]
    do:
      - "Synthetic labelled columns. Positives: emails, AU phones (mobile and landline, with spaces and +61), TFN and ABN with valid checksums, Luhn cards, IBANs, Medicare, DOB, names, addresses, IPs, free text with embedded emails. Hard negatives: 11-digit order numbers (include ones that pass the ABN checksum), 10-digit product codes, 16-digit tracking numbers, version strings like 1.2.3.4, sensor lat/lon, dates, postcodes, product_name and similar name hints. Add the real-world false positives seen on the current page: ISO dates (YYYY-MM-DD) and dd-Mon-yyyy dates, ticket codes (A/5 21171, PC 17599), 10 and 11 digit census geo ids, altitude ranges (1950-2200), ICO and lot numbers (03-0-0067 style), URLs ending in .svg."
      - "Seeded generator so results are deterministic. The test prints a precision/recall table and FAILS below the targets: High confidence precision >= 0.95, recall >= 0.90, zero High false positives on the hard negatives."
      - Write this early; every later change to the engine is measured by it.
    done_when: The test is part of `npm test`; the table is pasted in the PR description.

  - id: BENCH-PERF
    title: Latency bench wired into the gate
    priority: P0
    depends_on: [T0]
    files_new: [bench/dq.ts]
    files_touched: [package.json (gate and a bench:dq script), bench/baselines]
    do:
      - "Per 07_QUALITY_GATES.md: a bench with p95 budgets for the page's worker work on A, B, C and D (first insight, full profile, sensitivity pass, rules evaluation, exceptions export). Add to `npm run gate`."
    done_when: Budgets from `constraints.performance` enforced; baseline results committed beside the existing bench baselines.

  - id: SEC
    title: Make privacy visible and tested
    priority: P1
    depends_on: [P1]
    files_touched: [test/security.test.ts, test/e2e/*, src/ui/quality-page.ts, src/ui/help-content.ts]
    do:
      - Footer line and help entry explaining the browser-enforced policy (CSP connect-src 'none').
      - Playwright test records every network request while loading B and running every scan and asserts there are none (B7). Extend security.test.ts to scan new modules for fetch, XMLHttpRequest, WebSocket, eval and new Function.
    done_when: Tests pass; the help text makes no claim the test does not back.

  - id: REP
    title: Shareable report
    priority: P2
    depends_on: [T12, R1, S1]
    files_touched: [src/data/dq-report.ts, src/ui/quality-page.ts, test/dq-report.test.ts]
    do:
      - "One self-contained, printable HTML page: score, top issues, per-column table, sensitivity summary (no values), rules, trend. Keep JSON, Markdown and CSV, adding scoreVersion and the new sections (fields only added, never removed)."
      - "Copy summary for data supplier: a short plain-language message listing what failed and how many rows, ready to paste into an email."
    done_when: The HTML report opens offline, prints cleanly, and contains no raw values for flagged columns.

  - id: A11Y
    title: Accessibility and visual regression for the page
    priority: P1
    depends_on: [P1]
    files_touched: [test/e2e/a11y.spec.ts, test/e2e/polish.spec.ts]
    do:
      - Extend the axe checks to every tab of the Quality page in both themes, including the distribution bars (labelled) and the sensitive banner. Add screenshot baselines for B and D at the three viewports (07_QUALITY_GATES says visual regression is a gap; start small).
    done_when: Zero serious violations; baselines committed and reviewed.

  - id: DOCS
    title: Documentation and decision records the repo requires
    priority: P1
    depends_on: []
    files_touched: [03_FEATURE_INVENTORY.md, 08_DECISION_LOG.md, 09_CHANGE_LOG.md, src/ui/help-content.ts, README.md]
    do:
      - Record D1-D6 in 08_DECISION_LOG.md, the new features in 03_FEATURE_INVENTORY.md, user-facing help for the Quality page, sensitivity wording and the rules file; change-log entries per milestone.
      - "Update the stale baseline lines in 07_QUALITY_GATES.md (it says 650 tests and no e2e; the repo now has 844 tests and Playwright specs)."
    done_when: Docs match behaviour; no feature ships without a change-log line.

  - id: FIT
    title: Fitness-for-purpose profiles
    priority: P2
    depends_on: [R1, T3]
    do:
      - "Small presets that change weights, severities and defaults: General analysis (default), Finance reporting (uniqueness and accuracy up), Machine learning (missingness, constants, leakage candidates), Sharing externally (sensitive flags raised to review and the export notice defaults to Mask)."
    done_when: Switching profile changes the score and the notice default predictably; documented in help.

  - id: T20
    title: Headless check (optional, later)
    priority: P3
    depends_on: [R2]
    do:
      - "A Node entry (for example npx turbofuzz-check data.csv --rules rules.json) reusing the pure modules (score, rules, sensitivity) to print pass/fail and write exceptions.csv, for CI and scheduled use. This is the honest substitute for webhook alerting."
    done_when: Same results as the browser on fixtures A-D (parity test).

verification:
  per_task: [npm run typecheck, npm test, npx playwright test polish smoke]
  new_tests_required: [test/name-hints.test.ts, test/sensitivity.test.ts, test/pii-benchmark.test.ts, test/plausibility.test.ts, test/rules.test.ts, test/history.test.ts, test/reference.test.ts, variants and mixed-format tests, quality-page tests, an e2e for the export notice, a network-silence e2e]
  visual: Quality page screenshots at 1440x900, 1024x768 and 390x844, light and dark, for datasets B and D, before and after; compare B at 1440 against dq-after-v3.png for layout intent (not pixel match). Also the STATES set.
  performance: Report worker timings for C and D before and after; compare with constraints.performance; `npm run gate` green.
  expected_outcome_on_B: >
    Score drops from 95.4 to a lower, honest value (my estimate 70-80; the mock-up's ~71 is illustrative; report the actual number). City and status spellings, mixed date formats,
    invalid emails and age 240 are visible, explained in plain English and fixable. 4 columns flagged as possibly sensitive (email, phone High; full_name Medium; balance Low), none affecting the score. Rows affected reads 1,045 of 1,240.
    With advisoryOnly=true the score is exactly 95.4.
  known_gap: test/e2e/chart-resize-loop.spec.ts launches its own browser; run it where the repo's Playwright browsers are installed.

definition_of_done:
  note: Taken from 07_QUALITY_GATES.md plus the commercial bar.
  per_milestone:
    - Problem statement, evidence, acceptance criteria, preserve-list and a rollback commit recorded.
    - Tests added at the right layer; new bench with a p95 budget wired into npm run gate.
    - Manual browser verification at three viewports and both themes, with screenshots.
    - Change-log entry and updated inventory and decision log.
    - Commercial bar criteria B1-B10 re-checked for the surfaces touched.
  preserve:
    - Existing score formula and bands when advisoryOnly=true.
    - CSP and test/security.test.ts.
    - Existing drill-downs, exports (fields only added), Recipe replay and recipe-parity cases.
    - All currently passing tests.

open_decisions_for_owner:
  - "D1: Scored vs advisory split (recommendation above), scoreVersion and the advisoryOnly toggle."
  - "D3: Export notice default (Include / Mask / Exclude). Recommendation: Include."
  - "D5: History on by default (with a first-run note) or off until enabled. Recommendation: on, aggregates only."
  - "Hash action: ship it, or mask and drop only? Hashing phone numbers is weak protection."
  - "Hint tables: confirm the sensitive classes (health, demographic) are in scope for v1, and whether US/UK/NZ/CA identifier packs are wanted later."
  - "Whether the optional headless check (T20) is worth building."
  - "D7 (BAND): thresholds for capping the band (50% empty or 20% invalid for fair; 25% or 50% for poor) and the wording of the reason line."
  - "OPT: default list of optional-looking column names and the reduced Completeness weight for optional columns."
  - "BENCH-REAL: owner decision made: pinned corpus in npm test using the 11 tested datasets plus 10-20 owner-supplied messy files; no nightly runs. Owner supplies the extra files and flags any with real personal data."
  - "Fix top 3 issues: confirm it is always one combined preview then separate undoable steps (recommended), never a one-click apply."
  - "Rows affected definition: confirm it should exclude advisory fuzzy suggestions and sensitivity (recommended)."
  - "Collapse threshold: top 5 issues shown by default, or a different number."

suggested_order: [T0, BENCH-REAL, BENCH-PERF, QUICK, MEASURE, H0, SEM, WIRE, SAFE, HDR, SENT, T1, BENCH-PII, T6, T7, T11, T8, FMT, T9, T2, BAND, OPT, FTX, DUPK, P1, VIS, UNIFY, ROWS, COPY, DIST, T3, C1, T12, STATES, E1, T4, T5, T10, R1, R2, S1, REF, SEC, A11Y, REP, DOCS, FIT, T20]
