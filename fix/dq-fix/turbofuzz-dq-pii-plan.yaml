  items:
    - {change: "Mini distribution bars instead of prose", task: DIST}
    - {change: "Only the top issue gets a primary button", task: VIS}
    - {change: "'+N pts' kept as a quiet grey pill for ranking", task: T12}
    - {change: "Rows affected tile replaces the 'columns look clean' tile", task: ROWS}
    - {change: "Column strip sorted worst first, equal height, max 2 chips", task: P1}
    - {change: "Collapse after 5 issues with 'Show N more'", task: T12}
    - {change: "Sensitive is a banner on Issues plus its own tab, never duplicated", task: T3}
    - {change: "Reduced colour count; purple reserved for sensitivity", task: VIS}
    - {change: "Impact lines contain only app-computable consequences", task: COPY}
    - {change: "Designed states beyond the happy path", task: STATES}
  dataset_b_expected_values:
    rows: 1240
    columns: 9
    status: {spellings: 8, canonical_values: 3, ACTIVE: 172, active: 165, Active: 164, inactive: 147, Inactive: 128, pending: 152, placeholders: {"N/A": 164, "-": 148, total: 312}, after_clean: {Active: 501, Inactive: 275, pending: 152, missing: 312}}
    signup_date: {iso: 888, day_month_year: 352, ambiguous_either_way: 156}
    email: {invalid: 52, empty: 92, masked_example: "h*********13@@g*****.com"}
    city: {Sydney: 143, sydney: 142, SYDNEY: 134, minority_spellings_rows: 276, merged_total: 419, fuzzy_suggestion: "Melb. 136 -> Melbourne 153"}
    age: {over_120: 15, max: 999, empty: 70}
    balance: {with_dollar_sign: 56, empty: 123}
    full_name: {off_shape: 155, empty: 0}
    duplicates: {rows: 40, groups: 40}
    rows_affected: {count: 1045, of: 1240, percent: 84, definition: "distinct rows failing at least one of: status not in canonical set (variants plus placeholders), date not ISO, email invalid, city minority spelling or Melb., age over 120, balance containing $"}
    sensitive_columns: {email: High, phone: High, full_name: Medium, balance: Low}
    note_on_full_name: "The mock-up shows 155 off-shape (matches the existing check). Earlier analysis cited 794 values off a stricter First Last shape; use whichever shape rule T6 implements and keep the issue at severity review."

constraints:
  performance:
    first_insight_ms_max_250k_rows: 1500        # B3, dataset C: score tile + top 3 issues
    full_profile_ms_max_71_columns: 3000        # B4, dataset D
    extra_worker_compute_ms_max_250k_rows: 600
    main_thread_long_task_ms_max: 50
    scan_cap_per_column_values: 5000            # sampled; exact on demand (B9)
    remove_12_column_cap: true                  # all text-like columns, one cancellable worker pass
    new_bundle_gz_kb_max: 40                    # engine, UI, rule editor; dictionaries lazy and counted separately
    dictionaries_gz_kb_max: 25                  # lazy, loaded only when a rule or column needs them
    network_requests_added: 0
  ui:
    use_tokens: [--control-h, --radius-sm, --fs-sm, --fs-md, --sp-1, --sp-2, --accent, --accent-soft, --qa-warn, --qa-warn-soft, --qa-warn-border, --qa-warn-text, --danger, --border, --panel, --panel-2, --text-dim]
    sensitive_chip_colour: neutral or info, NOT red/amber. Add a dark-theme variant.
    control_height: var(--control-h) 32px; 40px at <=720px
    no_text_smaller_than_px: 11
  semantics:
    - Visual and wording changes must not silently change data semantics (06_DESIGN_SYSTEM.md visual change policy).
    - Fixes are Recipe steps: undoable, replayable, exported in recipe JSON and the Polars recipe export (keep tools/recipe-parity cases passing).
    - Never mutate data without a preview and an explicit click.
    - Recipe and rules file formats are versioned and backward compatible (migrate old files; never reject them).

milestones:
  - id: M0
    name: Foundations (measurement, semantics, wiring)
    tasks: [BENCH-REAL, QUICK, MEASURE, SEM, WIRE]
    exit_gate: "Junk-monotonicity and exact-count property tests pass; one issue list feeds the score; corpus must-not-flag cases for identifiers and dates pass. Nothing on the page is redesigned yet."
  - id: M1
    name: Honest score and trustworthy PII
    tasks: [T0, SAFE, HDR, SENT, H0, T1, T6, T7, T8, T9, FMT, T11, T2]
    exit_gate: "On B the score reflects spelling, format and range issues in plain English; no unsafe conversion offered on any of the 11 corpus datasets; header and sentinel detection work; sensitive engine passes BENCH-PII; advisoryOnly=true reproduces 95.4; performance within constraints."
  - id: M2
    name: Insight and workflow
    tasks: [T3, UNIFY, P1, VIS, ROWS, DIST, COPY, C1, BAND, OPT, FTX, DUPK, T12, STATES, E1, T4, T5, T10]
    exit_gate: "Page redesign (v3 spec) shipped with skeletons; one issue model; distribution bars; rows-affected tile; designed states; column profile and per-column scores; exception export; mask/hash/drop with undo; export notice."
  - id: M3
    name: Rules, reference data and history
    tasks: [R1, R2, REF, S1]
    exit_gate: "Recommended rules accepted and saved; the saved file re-applies on a re-load of the same schema; trend and drift visible across two loads; Accuracy applicable for recognised columns."
  - id: M4
    name: Trust and polish
    tasks: [BENCH-PII, BENCH-PERF, SEC, REP, A11Y, DOCS, FIT, T20]  # BENCH-REAL starts in M1 and gates every milestone
    exit_gate: "All commercial_bar criteria B1-B10 pass; npm run gate green including the new bench; docs and change log updated."
milestone_note: "BENCH-PII and BENCH-PERF are listed in M4 for the exit gate, but the corpus and bench scripts should be written EARLY (with T0 and T1) so every task is measured as it lands."

tasks:
  - id: T0
    title: Fixtures and baseline
    priority: P0
    depends_on: []
    do:
      - Create a TypeScript fixture builder reproducing dataset B (and A, C, D shapes) for unit tests; port the seeded generator from test/polish/turbofuzz-test-data.js.
      - Record the baseline (score 95.4 on B, DQ page worker timings on C and D, bundle size).
      - Write the problem statement, evidence, acceptance criteria, preserve-list and rollback point in the PR description as 07_QUALITY_GATES.md requires.
    done_when: Fixtures live under test/fixtures/ and are used by new tests; baseline numbers recorded.

  - id: H0
    title: Shared whole-word name-hint module (also needed by the chart brief)
    priority: P0
    depends_on: [T0]
    files_new: [src/data/name-hints.ts, test/name-hints.test.ts]
    files_touched: [src/data/findings.ts (NON_NEGATIVE_NAME, MEASUREMENT_NAME), src/ui/chart-utils.ts (MEASURE_HINT)]
    do:
      - Implement the tokenizer (non-alphanumerics, camelCase, digits) and a data table of hint groups (nonNegative, measurement, money, rate, additive, personal, contact, government, financial, health, location, date-of-birth).
      - Replace the substring regexes in findings.ts and chart-utils.ts with it. Keep behaviour identical for true matches.
    done_when: "Regression tests pass (age vs percentage/image/package/manage, rate vs generate, count vs discount, ratio vs duration, size vs resize). Existing findings and chart tests still pass."

  - id: T1
    title: Sensitivity engine (pure module)
    priority: P0
    depends_on: [H0]
    files_new: [src/data/sensitivity.ts, test/sensitivity.test.ts]
    files_touched: [src/data/text-profile.ts]
    do:
      - "Implement sensitivity_model: class, confidence, reasons, checksum-collision rules, corroboration rule for name, classification label defaults."
      - Extend text-profile (Medicare, IP, lat/lon, dob-like, embedded-in-text scan). Keep existing shapes and tests unchanged.
      - "Export scoreSensitivity(columnsMeta, perColumnShapes, options): SensitiveFinding[]."
    done_when: >
      On fixture B: email=High, phone=High, full_name=Medium, balance=Low, customer_id not flagged. On A, C, D: zero findings.
      Random 11-digit and 16-digit columns are not High. Pure function <= 5 ms for 71 columns given precomputed shapes.

  - id: T2
    title: Worker pass for all text-like columns
    priority: P0
    depends_on: [T1]
    files_touched: [src/ui/app.ts (refreshSensitiveColumns), src/ui/worker-client.ts, src/worker/protocol.ts, src/worker/search.worker.ts]
    do:
      - Replace the 12-column loop with ONE batched, cancellable worker request profiling every string/category/identifier column from a bounded sample; return shapes and scanned/sampled counts.
      - Restart on dataset or step change (reuse sensitiveKey). Never block first paint. Stream results per column.
      - Support "Scan all values" for exact counts on one column.
    done_when: Dataset D scans fully within budget; dataset C within budget; the 12-column cap is gone; no main-thread long task over 50 ms.

  - id: T3
    title: '"Possibly sensitive columns" UI, column chips, dismiss/confirm, labels'
    priority: P0
    depends_on: [T2, P1]
    files_touched: [src/ui/quality-page.ts, src/ui/column-inspector.ts, src/ui/table.ts or slick-table.ts (header chip), src/ui/overview.ts, src/styles.css, src/ui/recipe-mapping.ts]
    do:
      - "The Issues tab shows only the purple one-line sensitive banner (page_design.sensitive_banner); the full list lives in the Sensitive tab and is never duplicated on Issues."
      - "Replace buildSensitive() with grouped-by-confidence cards: column, class, classification label picker, Why (e.g. 94% of sampled values look like email; column name contains email), masked examples with reveal, actions Not sensitive / Mark sensitive plus the T4 menu."
      - Add the neutral chip to the column header and inspector with the same Why in the tooltip.
      - Persist per D4. Add onSensitiveChange to QualityPageCallbacks.
      - "Section copy: Possibly sensitive columns. Advisory only; these are not counted against your score."
    done_when: B shows 3 columns (+1 collapsed low). Dismissing hides the chip everywhere; reload via Recipe restores it. Score unchanged by any flag action. Screenshots at 1440x900 and 390x844.

  - id: T4
    title: Actions for flagged columns (mask, hash, drop)
    priority: P1
    depends_on: [T3]
    files_touched: [src/data/clean-ops.ts, src/data/transform-ops.ts, src/data/recipe.ts, src/data/recipe-polars.ts, src/data/recipe-support.ts, tools/recipe-parity/cases, "test/*recipe*.test.ts"]
    do:
      - Add clean ops mask (first/last N or format-aware) and hash (salted SHA-256 via crypto.subtle; warn that low-entropy values like phone numbers remain re-identifiable). Reuse drop.
      - Preview with 5 masked before/after rows and the affected row count, then Apply as an undoable Recipe step.
      - Emit equivalent Polars code or list the op as not translatable in recipe-support with parity cases.
    done_when: Each op undoes cleanly; recipe round-trips; parity tests pass or the unsupported op is listed honestly.

  - id: T5
    title: Export notice for flagged columns
    priority: P1
    depends_on: [T3]
    files_touched: [src/ui/export-panel.ts, src/ui/export-formats.ts, src/ui/app.ts]
    do:
      - "When a non-dismissed High/Medium (or confirmed) column is in scope, show one line in the export dialog: This export includes 3 columns that may contain sensitive data: email, phone, full_name, with Include (default), Mask, Exclude. No extra click for Include. Ignore Low."
    done_when: Export with defaults has the same click count; Mask/Exclude produce the expected file; e2e covers it.

  - id: T6
    title: Spelling variants (deterministic) as a scored Consistency check
    priority: P0
    depends_on: [T0]
    files_touched: [src/data/similar-clusters.ts (or new src/data/variants.ts), src/data/score.ts, src/worker/search.worker.ts, src/ui/quality-page.ts, src/ui/similar-dismissals.ts]
    do:
      - Group category-like values by normalize() key (case, whitespace, diacritics, trailing punctuation). A group with more than one distinct spelling is a variant group.
      - "New check per affected column in consistency: city uses one spelling per value. pass = rows equal to the group's most frequent spelling; fail = rows in minority spellings."
      - "Fix: Standardise to most common as a Recipe step (existing replace/case ops) with preview. Respect similar-dismissals."
      - Keep FUZZY matches (Melb. vs Melbourne) advisory (review severity), linked to the existing similar-clusters view; not scored (D1).
    done_when: B city shows Sydney/sydney/SYDNEY as one variant group; status shows active/Active/ACTIVE and inactive/Inactive; each with row counts and a working fix. Consistency is no longer n/a on B. Free-text and identifier columns excluded.

  - id: T7
    title: Mixed formats inside one column
    priority: P0
    depends_on: [T0]
    files_touched: [src/data/suggestions.ts, src/data/mask-profile.ts, src/data/score.ts, src/ui/quality-page.ts]
    do:
      - Add a mixedDate suggestion: share per detected date pattern (ISO, d/m/y, m/d/y, month names) and an ambiguity flag when day and month are both <= 12 and order cannot be inferred from other values.
      - Verify and, if missing, add mixedNumberSymbol: currency symbols or thousands separators on part of a numeric column.
      - "Count both in Validity. Fix buttons Standardise to yyyy-mm-dd (existing toDate op; explicit day-first/month-first choice when ambiguous)."
    done_when: B signup_date reports the format split with percentages and an ambiguity warning; balance reports the symbol mix; both reduce Validity and each has a working preview and fix.

  - id: T8
    title: Pattern validity for recognised columns
    priority: P0
    depends_on: [T1]
    files_touched: [src/data/score.ts, src/data/text-profile.ts, src/ui/quality-page.ts]
    do:
      - "When a column is recognised as email, URL, phone, ABN, ACN, TFN, IBAN or postcode (shape share >= 60% OR a matching name hint with >= 30% share), count non-empty values that FAIL that shape as Validity failures. Filter to failing rows through the existing pattern path."
      - Examples are masked (T3 rules).
    done_when: B email shows about 5% invalid ("@@") in Validity with a Filter button; valid emails are not penalised; a weak-hint, low-share column is NOT scored.

  - id: T9
    title: Plausible ranges (impossible values) on the shared hint module
    priority: P1
    depends_on: [H0]
    files_new: [src/data/plausibility.ts, test/plausibility.test.ts]
    files_touched: [src/data/score.ts, src/data/findings.ts, src/ui/quality-page.ts]
    do:
      - "Rule table keyed by whole-word hints: age 0-120; pct/percent/rate 0-100 only when values look like percentages; qty/quantity/units/count >= 0; year 1900 to current+1; created/signup/order/birth dates not in the future."
      - Each rule is a plain sentence, user-editable (override saved per D4) and counted in Validity.
      - Merge with the existing non-negative and measurement logic in findings.ts so there is ONE rule source.
    done_when: B age 240 counts as implausible ("unknown" is a type conflict, counted once). Users can change or disable a rule. No rule applies to a column without a hint.

  - id: T10
    title: Sensible defaults for Consistency and Timeliness
    priority: P1
    depends_on: [T6]
    files_touched: [src/data/score.ts, src/data/pair-checks.ts, src/data/dependencies.ts, src/ui/quality-page.ts]
    do:
      - Auto-propose pair checks from name pairs (start/end, created/updated, from/to, open/close, min/max) as scored consistency checks marked "suggested" with a one-click disable.
      - "Timeliness stays informational unless the user sets a rule. Show Latest value is 1,034 days old as a plain note with a one-click freshness rule. Do not invent a pass/fail threshold."
    done_when: A pair-check is proposed where a name pair exists; B still shows freshness as a note without altering the score.

  - id: T11
    title: Plain-English evidence
    priority: P0
    depends_on: [T0]
    files_touched: [src/data/mask-profile.ts, src/data/score.ts, src/ui/quality-page.ts]
    do:
      - "Replace mask jargon with a sentence and three examples: 155 names do not follow the usual shape Aaaa Aaaa (e.g. bob smith, Frank Li, Dave  Patel)."
      - Provide and unit-test a mask-to-words helper (A=letters, 9=digits). Mask examples for sensitive columns (T3).
      - Add the B2 render test that fails on raw masks.
    done_when: No raw mask strings in visible text; every failing check shows up to 3 examples.

  - id: UNIFY
    title: One issue model across Overview, Reports and the Quality page
    priority: P0
    depends_on: [WIRE, T6, T7, T8, T9]
    files_touched: [src/data/findings.ts, src/data/score.ts, src/ui/quality-page.ts, src/ui/overview.ts, src/ui/triage-panel.ts, src/ui/app.ts]
    do:
