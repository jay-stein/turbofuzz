# TurboFuzz: Data Quality + sensitive-data (PII) upgrade  |  PLAN v3.2
# Machine-readable plan for Claude Code. Self-contained; independent of the chart UX brief (they share one task, H0).
# Repo: jay-stein/turbofuzz   Branch base: agent/text-column-network
# Rules: do not commit or push unless the owner asks. Extend existing modules; do not build parallel systems.
#        Everything runs in the browser. No network, no telemetry, no data leaves the machine.
# Changes from v1: added a commercial bar, a unified issue model, page redesign, column profile and per-column scores,
#        exception export, rules and contracts, history and drift, reference data, measured PII accuracy, a performance
#        gate, and the repo's own definition of done. Tasks are regrouped into four milestones.
# Changes from v3.1 (v3.2): root-cause assessment (turbofuzz-dq-root-cause.md). The main cause is type inference and profiling, not the parser or the
#        page. New foundation milestone M0 with tasks MEASURE, SEM, WIRE, QUICK; UNIFY premise corrected; G10 and G12 corrected; order re-sequenced.
# Changes from v3 (v3.1): the CURRENT page was tested on 11 datasets (8 earlier + coffee ratings, US police killings, GDPR fines). Findings are in
#        test_findings_v31; new tasks SAFE, BAND, OPT, SENT, HDR, FMT, FTX, DUPK, BENCH-REAL close the gaps the v3 plan did not cover.
# Changes from v2 (v3): page_design rewritten from an owner-approved visual mock-up (dq-after-v3.png / dq-after-v3.html, attached with this
#        file). New tasks DIST, ROWS, VIS, STATES, COPY. T12, T3, P1 and A11Y updated. See design_refinements_v3. The mock-up is a
#        VISUAL REFERENCE: build from the design tokens and the spec below, do not copy its markup. Its score (~71) and '+pts'
#        values are illustrative; counts and examples are real for test dataset B.

verdict_on_v1:
  summary: >
    v1 would have made the page an honest checker (score reflects spelling, format and range problems; PII flagged). That is
    roughly the first 40-60% of the gap. It would NOT have reached the insight and polish of a commercial tool, because commercial
    tools win on profiling depth, per-column scores, exception handling, reusable rules, history, reference data, a coherent
    information design, and demonstrated detection accuracy. v2 adds those.
  gaps_closed_in_v2:
    - Unified issue model (reuse src/data/findings.ts Finding) instead of a third list.
    - Page information design with a triage summary, column health strip and progressive loading.
    - Column profile and per-column health scores (the owner's docs/data-qc-spec.md asks for scores per table AND column).
    - Row-level exception export (spec 2.1 "exception logging").
    - Rule recommendations, a rule editor with severities and thresholds, and a saved rules file (spec section 4 "automated discovery").
    - Local history, trend and schema drift (spec 2.1 "historical trend analysis, schema drift").
    - Bundled reference data so Accuracy can apply offline (countries, currencies, AU states/postcodes).
    - PII precision/recall measured against a labelled corpus, with hard negatives, and checksum-collision handling.
    - Privacy made visible and testable; a latency gate in `npm run gate`; the docs updates the repo's quality gates require.

meta:
  owner: Quincy (Perth, Australia)
  product_ethos: Rapid, low-latency, in-browser data cleaning and analysis. Speed and privacy are the top constraints.
  problem: >
    The Data Quality page is not very helpful. On test dataset B (planted problems) it scores 95.4 "good" because it effectively
    checks empty cells and exact duplicate rows. Consistency, Timeliness and Accuracy show n/a. Sensitive-data detection exists
    but is advisory, capped at 12 columns, has no column-name signal, no actions, and no export warning.
  goals:
    - Make the score honest and explainable at dataset, dimension, column and check level.
    - Turn the page from a report into a fix queue (preview, apply, undo, recorded in the Recipe).
    - Flag columns that MAY contain sensitive information, clearly separate from "wrong" data, never penalising the score.
    - Let users keep their expectations as reusable rules and see change over time.
    - Meet the speed budgets in `constraints`.
  non_goals:
    - Legal or compliance verdicts (no "GDPR compliant" claims). Wording stays advisory.
    - "Any server, upload, webhook, Slack/Jira alerting (impossible under the CSP and against the product ethos). Alternative: a rules file plus the existing pipeline emitters (R2) and an optional headless check (T20)."
    - Statistical outlier work (has its own page) and ML-based classifiers (cost, size, explainability).

commercial_bar:
  note: What "commercial quality" means here. Each line is a testable acceptance criterion for the whole programme.
  criteria:
    - id: B1
      rule: Every issue shown has evidence (counts and up to 3 examples), impact (rows and columns), a one-line "why it matters", a fix with preview, and Undo.
    - id: B2
      rule: No jargon in visible text. A test renders the page for datasets A-D and fails if it finds raw masks like "A A" or "9-9", internal ids, or "undefined".
    - id: B3
      rule: Time to first insight <= 1.5 s on the 250k-row dataset (score tile, top 3 issues). Slower work streams in under skeletons and never blocks the page.
    - id: B4
      rule: Full profile and all checks on the 71-column dataset <= 3 s; each column's own result appears as soon as it is ready.
    - id: B5
      rule: PII detection precision >= 0.95 and recall >= 0.90 at High confidence on the labelled corpus, zero High false positives on the hard-negative set (see BENCH-PII).
    - id: B6
      rule: Dark and light themes; 1440x900, 1024x768 and 390x844; keyboard operable; zero serious axe violations on the page; reduced-motion respected.
    - id: B7
      rule: Zero network requests during load and all scans (Playwright asserts it); no fetch, XHR, WebSocket, eval or new Function in new code.
    - id: B8
      rule: Numbers are explainable. Clicking any score, dimension, column score or check shows how it was computed and drills to the failing rows.
    - id: B9
      rule: Sampled numbers say so ("5,000 of 250,000 values scanned") and offer an exact scan on demand. Nothing approximate is presented as exact.
    - id: B10
      rule: The same issue never appears as three different lists (Overview, Reports, Quality page). One issue model, one source of truth.

environment_notes:
  install: >
    `npm ci` fails where cdn.sheetjs.com is blocked (package `xlsx`). Workaround: install without it, then stub node_modules/xlsx.
    Expect only xlsx-related typecheck errors and one xlsx export test failure. Never commit that workaround.
  build: npx vite build
  preview: npx vite preview --host 127.0.0.1 --port 4173
  unit_tests: "npm test   # tsx --test test/*.test.ts (844 tests; only the xlsx stub test fails)"
  e2e: npx playwright test
  gate: "npm run gate   # typecheck, tests, e2e, build and bench scripts; add the new DQ bench here (BENCH-PERF)"
  load_test_data: |
    await page.addScriptTag({ path: "test/polish/turbofuzz-test-data.js" });
    await page.evaluate(() => window.TF_TEST.load("B"));   // A sales, B messy customers, C 250k taxi trips, D 71-column assay
  tabs: [Overview, Data Quality, Table, Pivot View, Outliers, Relationships, Chart]
  hard_constraint_csp: >
    public/_headers sets `connect-src 'none'`, `script-src 'self'`, no unsafe-eval. fetch() of any file, even same-origin, is BLOCKED.
    Ship reference data and dictionaries as JS modules loaded with dynamic import() (Vite emits chunks; script-src 'self' allows them).
    Never fetch() a JSON file. test/security.test.ts guards no-eval and no-fetch; extend it, do not weaken it.

reality_check_existing_code:
  note: Reuse these. The gap is that detection exists in several places but is not scored, unified or actionable.
  score:
    file: src/data/score.ts
    facts:
      - computeDQScore(columns, stats, rowCount, config, userChecks) builds completeness, validity, uniqueness and user checks. Dataset level only.
      - Validity counts suggestions typeConflict, mixedNumber, formula, meta.pattern.offCount and a typeDowngrade check.
      - "A header comment says advisory findings (outliers, near-duplicates, drift) are DELIBERATELY absent from the score. See D1."
      - "Weights: completeness 30, validity 30, uniqueness 15, consistency 15, timeliness 10, accuracy 0. Bands: good >= 90, fair >= 75."
      - Consistency is scored only via user "Compare with..." pair checks; Timeliness only with a user freshness rule.
  page:
    file: src/ui/quality-page.ts
    facts:
      - "Sections: hero, dimensions, Freshness, What to fix first, Checks (flat table), Sensitive data, Matrix (column x dimension)."
      - buildSensitive() lists columns with counts; no actions, no confidence, no name hints, no dismiss.
      - QualityPageCallbacks has onFilter(check), onConvert, onExport, onConfigChange.
  findings_engine:
    file: src/data/findings.ts
    facts:
      - "Finding {id, report, severity: fix|review|info, title, evidence[], impact{rows,columns}, fixLabel, action, extraActions} already powers Overview/Reports."
      - "Producers: qualityFindings, coMissingnessFindings, dependencyFindings, groupAnomalyFindings, relationshipDataFindings, textProfileFindings, similarClusterFindings, distributionFindings, anomalyFindings, explainColumn."
      - FindingAction already covers suggestion, filterSpecial, filterDuplicates, filterRange, filterText, cleanNulls, merge, flagAnomalies, winsorize.
      - "BUG to fix in H0: NON_NEGATIVE_NAME and MEASUREMENT_NAME are SUBSTRING regexes (line ~47). 'age' matches percentage, image, package, manage; 'rate' matches generate; 'size' matches resize."
  pii_scan_today:
    files: [src/data/text-profile.ts, src/ui/app.ts]
    facts:
      - "text-profile.ts classifies whole VALUES: email, url, phone, creditCard (Luhn), iban (checksum), taxFileNumber, abn, acn, governmentId."
      - app.ts refreshSensitiveColumns() scans only string/category/identifier columns, .slice(0, 12), via client.getTextProfile(column, 1, false).
      - Results never reach the score, table, charts or exports.
      - text-profile does not search INSIDE long text (free text with embedded emails is missed).
  already_detectable_but_not_scored:
    - what: Near-duplicate / similar-value clusters
      files: [src/data/similar-clusters.ts, src/search/similar.ts, src/search/normalize.ts, src/ui/similar-dismissals.ts]
    - what: Dominant-format mask per column and off-pattern rows
      files: [src/data/mask-profile.ts]
    - what: Per-column suggestions (sentinel, boolean, number with symbol, date, mixedNumber, typeConflict, formula)
      files: [src/data/suggestions.ts]
    - what: Pair and key checks, dependency detection, DQ report, pipeline emitters (sodacl, dbt, gx, dqdl)
      files: [src/data/pair-checks.ts, src/data/dependencies.ts, src/data/dq-report.ts]
    - what: Clean ops usable as fixes
      files: [src/data/clean-ops.ts, src/data/transform-ops.ts]
    - what: Column inspector (per-column UI to extend, not replace)
      files: [src/ui/column-inspector.ts]
  existing_process_docs:
    - "07_QUALITY_GATES.md: problem statement, evidence, acceptance, preserve-list, rollback point, tests, change log, latency check with a bench p95 budget wired into npm run gate."
    - "docs/data-qc-spec.md: the owner's enterprise DQ target (profiling, per-table AND per-column 0-100 scores, trend, schema drift, exception logging, alerting, PII/PHI discovery with risk tagging, rule recommendations). v2 maps each item to an offline equivalent (see benchmark_mapping)."

benchmark_mapping:
  source: docs/data-qc-spec.md
  rows:
    - spec: Statistical profiles (counts, null ratios, min/max, types, distinct, frequencies)
      offline_equivalent: Column profile drawer (C1)
    - spec: Health scores per table, column, dataset
      offline_equivalent: Per-column score from its own checks (C1) plus the existing dataset score
    - spec: Dashboards with trend and schema drift
      offline_equivalent: Local snapshots, trend sparkline, drift diff (S1)
    - spec: Exception logging to error tables
      offline_equivalent: Exceptions export, one row per failing cell with reason (E1)
    - spec: Alerting webhooks
      offline_equivalent: NOT possible by design. Rules file + emitters (R2) and optional headless check (T20)
    - spec: PII/PHI/financial/gov-ID discovery via regex, dictionaries, NLP
      offline_equivalent: Value shapes + checksums + whole-word name hints + small bundled dictionaries (REF); no ML
    - spec: Risk tagging and classification tags
      offline_equivalent: Class and confidence per column, user-set classification label (Public/Internal/Confidential/Restricted), exported in the report
    - spec: Automated rule recommendations
      offline_equivalent: Rule recommender from the profile (R1)
    - spec: Accuracy via reference checks
      offline_equivalent: Bundled reference lists (REF) make Accuracy applicable for recognised columns

baseline_on_test_dataset_B:
  score: 95.4 (good)
  dimensions: {completeness: 91.6, validity: 98.5, uniqueness: 96.8, consistency: n/a, timeliness: n/a, accuracy: n/a}
  planted_problems_and_current_detection:
    - problem: "Empty cells, plus 'N/A' and '-' placeholders in status"
      detected: yes
    - problem: 40 exact duplicate rows
      detected: yes
    - problem: "city spelled Sydney / sydney / SYDNEY / Melb."
      detected: no on the DQ page (similar-clusters exists, Outliers panel only)
    - problem: "status in mixed case (active / Active / ACTIVE, inactive / Inactive)"
      detected: no
    - problem: "~5% emails contain '@@'"
      detected: "no. Validity says every value matches. The PII scan finds 1,096 emails of 1,148 non-empty."
    - problem: "signup_date mixes ISO (2023-03-14) and d/m/2023 (about 30%); d/m ambiguous"
      detected: no
    - problem: "balance mixes '$1,234' and plain 1234.56"
      detected: partially (verify how suggestions reports hasSymbol)
    - problem: "age 240 and 'unknown'"
      detected: only Outliers page / type conflict; verify the score counts 'unknown'
    - problem: "full_name casing / double and leading spaces"
      detected: "yes but unreadable (155 don't match A A)"
  expected_sensitive_flags_on_B:
    email: High (value pattern + name hint)
    phone: High (value pattern + name hint)
    full_name: Medium (personal-name hint; no value pattern exists for names)
    balance: Low (financial name hint)
    customer_id: none by default (identifier, not personal on its own)
  expected_no_flags: "Datasets A (sales), C (taxi trips), D (assay). product_name, zone, type, batch, flag_1 must NOT be flagged."

design_decisions:
  - id: D1
    question: Should deterministic format, spelling and range problems change the DQ score?
    recommendation: >
      Yes for deterministic checks (case/whitespace spelling variants, mixed formats, invalid values for a recognised pattern, impossible ranges).
      No for fuzzy matches (Melb. vs Melbourne) and for ALL sensitive-data flags: advisory, outside the score.
    consequence: >
      Existing datasets will score lower. Add scoreVersion 2 to the report, show a one-time note, and add DQScoreConfig.advisoryOnly (default false)
      so the owner can revert. With advisoryOnly=true the score on B must still be exactly 95.4.
    owner_decision_needed: true
  - id: D2
    question: Wording for sensitive columns
    decision: >
      "May contain" language. A flag is never an error, never red, never in the failing list. Show WHY. Provide "Not sensitive" and "Mark sensitive".
      Section title "Possibly sensitive columns".
  - id: D3
    question: Default behaviour at export for flagged columns
    decision: Non-blocking one-line notice in the export dialog with Include (default), Mask, Exclude. Never add a mandatory click.
  - id: D4
    question: Where dismissals, marks, rules and classification labels are stored
    decision: >
      In the Recipe and the rules file (replayable on next month's file), with a sessionStorage mirror like similar-dismissals.ts.
      Keyed by column name + type, never by position.
  - id: D5
    question: History storage and privacy
    decision: >
      Opt-in per browser, default ON with a clear first-run note, IndexedDB only, aggregates only (counts, rates, scores, schema). Never values or examples.
      Category label diffs are stored only for low-cardinality NON-sensitive columns. "Clear history" is one click. Add a switch in settings.
  - id: D6
    question: One issue model
    decision: >
      Failing scored checks, findings.ts findings and sensitivity flags all render through the Finding shape (severity fix|review|info).
      Mapping: failing scored check -> fix; fuzzy/advisory -> review; sensitive flag -> info with a neutral style. Dedupe by (column, kind).

sensitivity_model:
  module: src/data/sensitivity.ts   # new, pure, worker-safe, no DOM
  classes:
    - {id: contact, covers: "email, phone, mobile, personal URL, postal address"}
    - {id: government_id, covers: "TFN, Medicare, passport, licence, SSN-like, national id"}
    - {id: financial, covers: "card (Luhn), IBAN, BSB/account, salary, income, balance (low confidence)"}
    - {id: personal_name, covers: person names}
    - {id: demographic, covers: "date of birth, age (with other signals), gender, ethnicity, religion (name hints only)"}
    - {id: health, covers: "diagnosis, medication, patient, condition (name hints only)"}
    - {id: location, covers: "street address, high-precision lat/lon pair, IP address"}
    - {id: free_text, covers: "long text columns whose values contain embedded email/phone/ID shapes"}
  signals:
    value_shapes:
      source: "Existing TextShapeCounts. Extend with AU Medicare (10 digits, check digit), IPv4/IPv6, lat/lon pairs, dob-like (plausible age 0-110 when a dob hint is present). AU postcode only as corroboration, never alone."
      embedded_scan: "For long text columns, search INSIDE values (not whole-value match) for email/phone/TFN-like shapes on a sample of at most 2,000 rows; classify as free_text."
      sampling: "Stratified sample of at most 5,000 non-empty values per column. Report share = matches / sampled and state it (B9). Offer Scan all values."
      checksum_collisions: >
        An arbitrary 11-digit number passes the ABN checksum about 1 time in 89, and about 1 in 10 random 16-digit numbers pass Luhn.
        So a validated shape alone is NOT High. Require a column-level share >= 60% (not a few hits) and, for ABN/TFN/card, a corroborating name hint or >= 90% share.
    name_hints:
      module: src/data/name-hints.ts   # shared with findings.ts, chart-utils.ts and the chart recommender (task H0)
      method: Whole-word token match on the column name split on non-alphanumerics and camelCase. NEVER substring regexes.
      regression_tests:
        - '"discount" must not match "count"'
        - '"duration" must not match "ratio"'
        - '"percentage", "image", "package" must not match "age"'
        - '"generate" must not match "rate"'
        - '"product_name" must not hint personal_name'
        - '"ip_address" is location/ip, not postal address'
        - '"zone", "batch", "type", "flag_1" never flag'
      personal_name_rule: >
        The token "name" counts only with a person qualifier (first, last, given, sur, full, middle, customer, patient, employee, contact, client, member)
        or when corroborated by another flagged column (email or phone). Otherwise ignore.
      hint_tokens_examples: [email, phone, mobile, dob, birth, birthdate, address, street, suburb, postcode, ssn, tfn, abn, medicare, passport, licence, license, salary, income, wage, iban, bsb, account, card, patient, diagnosis, gender, ethnicity, religion, ip, lat, lon, latitude, longitude]
      note: Hint lists live in one reviewed data table, not scattered regexes.
    dictionaries:
      note: "Optional, lazy dynamic-import chunks (<= 25 KB gz in total, see REF): common given names and surnames used only to RAISE confidence of personal_name when the column name is ambiguous. Never the sole reason to flag."
  confidence:
    high: "validated shape with share >= 60% plus the checksum rules above, OR shape share >= 30% AND a matching name hint"
    medium: "name hint matches AND shape share 5-30%, OR a strong name hint (dob, tfn, passport, medicare, ssn, diagnosis) with no value signal"
    low: "weak name hint only (balance, account, age, address alone). Collapsed by default."
  classification_labels:
    note: "User-set tag per column: Public, Internal, Confidential, Restricted. Suggested default from class and confidence (e.g. government_id/health -> Restricted). Stored per D4; shown in the report. Advisory only."
  output_shape: |
    interface SensitiveFinding {
      column: number; name: string;
      class: SensitiveClass; confidence: "high" | "medium" | "low";
      reasons: { kind: "value" | "name" | "dictionary"; label: string; share?: number; count?: number }[];
      sampled: number; scanned: number;          // for B9 transparency
      label?: "public" | "internal" | "confidential" | "restricted";
      dismissed?: boolean; confirmed?: boolean;
    }
  rules:
    - Never include raw sample values in the finding. UI examples are masked by default (j***@example.com) with click-to-reveal.
    - A finding never changes meta.stats, the DQ score or any check pass/fail.
    - Identifier columns (customer_id) are not flagged unless they carry a shape or a strong name hint.
  where_it_shows:
    - Quality page section "Possibly sensitive columns", grouped by confidence, with Why and actions.
    - A small neutral "Possibly sensitive" chip on the column header in Table and in the column inspector.
    - 'Overview facts line: "3 columns may contain sensitive data" linking to the section.'
    - Export dialog notice (T5).
    - "Reports (JSON/Markdown/CSV/HTML): counts, column names, classes and reasons only; never values."

page_design:
  note: >
    Information design for the Quality page (v3, approved from a visual mock-up). Replaces the current flat scroll of eight sections.
    Keep the existing hero ring and band chip. Reference images: dq-after-v3.png (target) and dq-before.png (current app on dataset B).
  principles: [triage first, progressive disclosure, one issue list, every number drills down, skeletons not spinners, nothing blocks first paint, show distributions as shapes not prose, one primary action per screen region, restrained colour]
  first_viewport_1440x900: |
    +----------------------------------------------------------------------------------------+
    | [ring ~71 est.]  Data quality  [fair]                                                  |
    |  "Placeholders (N/A, -, empty) counted as missing - 8 issues - 4 columns possibly       |
    |   sensitive"   Biggest win: standardise "status" ... -> about +9 pts                    |
    |  [Fix top 3 issues...] (primary)  [Copy report] [Download JSON] [Score & weights]       |
    +----------------------------------------------------------------------------------------+
    | [3 Needs fixing] [4 Worth reviewing] [1,045 of 1,240 Rows affected 84%] [4 Possibly sensitive] |
    +----------------------------------------------------------------------------------------+
    | Columns - sorted worst first                         click a column to open its profile |
    | [status][signup_date][email][city][phone][balance][full_name][age][customer_id]          |
    |  each: name, type, 3-colour health bar, max 2 chips (+ PII chip), equal card height      |
    +----------------------------------------------------------------------------------------+
    | [Issues 8] [Columns] [Sensitive 4] [Rules] [History] [All checks]                        |
    | (purple banner) 4 columns possibly sensitive - email, phone, full_name, balance  Review->|
    | Issue card 1 (stripe red):  title  [+9 pts]                          [Standardise...]   |
    |   NOW (bars per spelling)  ->  AFTER CLEAN (bars per target value)   [Preview rows]     |
    |   Impact: measurable consequence only                                                   |
    | Issue cards 2..5 ... then "Show 3 more - 2 to review, 1 info"                           |
    +----------------------------------------------------------------------------------------+
    | footer: Computed locally in your browser - No data leaves this tab                      |
  summary_tiles:
    Needs fixing: 'count of severity=fix issues. Left border red. Sub-line "wrong or inconsistent values".'
    Worth reviewing: 'count of severity=review issues. Left border amber. Sub-line "may be fine, may not".'
    Rows affected: '"N of TOTAL" and a percentage; the number of distinct rows failing at least one deterministic issue (task ROWS). Neutral grey border. Click filters the table to those rows.'
    Possibly sensitive: 'count of flagged columns (all confidences). Purple border. Sub-line "not counted against score". Click opens the Sensitive tab.'
    removed_in_v3: A "columns look clean" tile. It was filler. The clean state is shown per column and in the strip instead.
  column_health_strip:
    order: "Worst first (most severe, then most affected rows). Clean columns last."
    card: "Fixed height. Name (semi-bold 12px), type (11px dim), 3-colour proportional bar (green clean, amber review, red fix/empty), then at most 2 chips pinned to the bottom, no wrapping, ellipsis on overflow. A purple PII chip counts toward the 2."
    clean_column: "Small green dot plus the word clean, no chip."
    scale: "9 columns fit in one row at 1440. Beyond that: wrap into rows of 9 with a 'Show all N columns' toggle after the first 2 rows; at 71 columns virtualise (C1). Never horizontal scroll inside the card."
    click: "Opens the column profile drawer (C1)."
  issue_card_anatomy:
    stripe: "8px rounded left stripe. red = fix, amber = review, grey = info. Purple is reserved for sensitivity and never used for issues."
    title: "Plain sentence with the column in quotes and the count, e.g. status has 8 spellings of 3 values, plus 312 placeholders. Right of the title a small grey pill '+9 pts' (tabular-nums). Pill is omitted for review and info items."
    body: "Either a distribution comparison (DIST) when the issue is spellings, formats or placeholders, or one evidence line, plus up to three masked example chips for validity issues."
    impact_line: "'Impact:' then ONE measurable consequence the app can compute (see COPY). Optional for review items."
    actions: "Right column. The first card in the list gets the single primary (solid accent) button. Every other card gets a secondary (outlined) button. Tertiary actions such as Preview or Dismiss are text-only ghost buttons below."
    progressive_disclosure: "Show the top 5 cards. A centred outlined button reads 'Show N more - X to review, Y info'. Info items (for example duplicates) live behind it by default."
  visual_rules:
    colour_budget: "Red and amber for severity, purple for sensitivity only, accent blue for the one primary action and selected tab, grey for info and neutral tiles. Green is only used in bars and the clean marker, not stripes."
    typography: "Issue title 13.5px semi-bold, body 13px, evidence 12px, meta 11px minimum. All counts use font-variant-numeric: tabular-nums. Example values and spellings use var(--mono)."
    one_primary: "At most one solid-accent button per card region and one in the hero (Fix top 3 issues). Do not paint every fix button blue."
    density: "Card padding 12px 14px, 8px gap between cards, max line width about 760px for prose."
  distribution_comparison:
    purpose: "Replace prose such as 'ACTIVE 172 - active 165 - Active 164' with a bar comparison. See task DIST."
    layout: "Two groups with an arrow between: NOW (one row per spelling or format) and AFTER CLEAN (one row per resulting value). Each row: mono label, horizontal bar, right-aligned count. Align the arrow to the first row. Groups align to the top."
    bar_colours: "red-tint = spellings that will be merged, green = the target value, grey = placeholders that become missing. Shape and label carry meaning as well as colour."
    cap: "Show at most 8 rows per group, then '+N more'. Row order is by count descending within each class."
  tabs:
    Issues: the cleaning queue (T12), grouped by severity, one card per issue with evidence, impact, preview, apply, undo. Starts with a one-line sensitive banner (not a card list).
    Columns: column cards and the profile drawer (C1)
    Sensitive: Possibly sensitive columns (T3). The only place the full sensitive list lives; the Issues tab shows a banner only.
    Rules: recommended and saved rules, editor, severities (R1, R2)
    History: score trend, drift versus previous load (S1)
    All checks: the existing flat table, kept for power users and exact counts
  sensitive_banner: "Purple-tinted single row: dot, bold '4 columns possibly sensitive', dim list of the column names and 'Not an error, and not counted in your score.', and a text button 'Review ->' that switches to the Sensitive tab."
  states: [empty (no file), loading with skeletons per section, partial (some columns done), sampled vs exact label, error with retry, long-running with Cancel, clean dataset, wide dataset (40+ columns), post-fix, dark theme, phone] # detailed in task STATES
  responsive: "1024: tabs scroll; column health strip wraps. 390: one column, tabs become a select, issue cards stack with actions beneath, distribution groups stack (NOW above AFTER CLEAN), 40px targets."
  accessibility: "Tabs follow the ARIA tabs pattern; health strip cells are buttons with text alternatives; colour is never the only signal (labels, chips and bar shapes carry it too); focus visible; reduced-motion respected."
  copy_rules: "Plain English. Say what is wrong, how many, an example, and what the fix will do. Never show raw masks, ids or the word 'undefined'. Impact lines follow task COPY."
  footer: "'Computed locally in your browser - No data leaves this tab.' (with the elapsed ms when known) and a Help link explaining the browser-enforced policy (SEC)."

test_findings_v31:
  note: >
    Measured on the current shipped page (branch agent/text-column-network), 1440px, real file input, checked against an independent pandas profile.
    11 datasets: titanic, penguins, pima, chipotle, tips, airquality (public), coffee ratings, US police killings, GDPR fines (public, messy),
    plus two seeded synthetic files (dirty cafe sales, HR with PII). All 11 scored 'good' (91.9 to 100). 0 console errors, loads under 1 s, render under 100 ms.
  works_well: [exact counts and drill-downs, clean files left alone with no false alarms (penguins, tips, airquality), placeholders such as NA, Unknown and '-' counted as missing, speed, layout at 43 columns]
  gaps:
    - {id: G1, finding: "Offers 'Convert to Integer/Number' for identifier-like text (Titanic Ticket 230 values lost, HR mobile leading zeros lost) and ranks it as a top fix", task: SAFE}
    - {id: G2, finding: "Score too forgiving: Titanic 95.8 good with Cabin 77% empty; HR 91.9 good with 102 invalid emails and 9 spellings of one department", task: BAND}
    - {id: G3, finding: "Optional or blank-by-design columns lead the ranking: HR card_number +34.3 pts, coffee lot_number +31.8 pts, chipotle choice_description +10.8 pts", task: OPT}
    - {id: G4, finding: "PII false positives: ISO dates read as Phone/TFN (cafe 8,016), ticket codes and census geo_id read as Phone/ABN, coffee altitude and ico_number read as Phone/TFN/ACN, DOB read as Phone/TFN", task: "T1 and BENCH-PII hard negatives"}
    - {id: G5, finding: "PII false negatives: card and phone numbers inside a free-text notes column (777 rows) missed; person names, street addresses, precise lat/long, DOB and salary columns never flagged", task: "FTX and H0/T1 hint tables"}
    - {id: G6, finding: "Hidden missing values: ERROR sentinel (2,908 cells), zeros meaning missing (Pima Insulin 374, SkinThickness 227; coffee moisture 264), epoch dates 1970-01-01 (GDPR 15 rows), zero fines (GDPR 11)", task: SENT}
    - {id: G7, finding: "Header detection: all-numeric first row with no header was consumed as the header (Pima 768 rows loaded as 767)", task: HDR}
    - {id: G8, finding: "Format-mask checks fire on columns where variation is normal: GDPR picture (flag URLs) ranked the number-one fix; police name 55 'off-format' for legitimate 3-part names and suffixes", task: FMT}
    - {id: G9, finding: "Exact-duplicate check is defeated by a unique id column: GDPR has 16 repeated (name, date, price) rows but reports 0 duplicates", task: DUPK}
    - {id: G10, finding: "CORRECTED in v3.2: currency text ('$2.39 ', '$100,000') already parses as number. Remaining: mixed forms inside one column are not scored (coffee harvest_year 2014 / 2014/2015 / Spring 2011-2012 / TEST; altitude ranges and units)", task: "T7 plus bench cases"}
    - {id: G11, finding: "Impossible values unflagged as issues: coffee altitude_mean_meters up to 190,164 m (4 rows over 9,000 m), total_cup_points = 0, HR malformed emails", task: "T8, T9 plus bench cases"}
    - {id: G12, finding: "CORRECTED in v3.2: case variants ARE detected (clusterSimilar finds FINANCE/finance/Finance, 660 rows) but only shown in Advanced signals at the bottom of the page and never scored or ranked; abbreviations (Eng./Engineering, HR/Human Resources) are not detected", task: "WIRE, T6"}
    - {id: G13, finding: "Wide-file scaling: coffee (43 columns) page is 6,860 px tall, the Sensitive section starts at 4,806 px and 'What to fix first' shows 5 of 21", task: "P1, STATES (collapse after 5, worst-first strip)"}
    - {id: G14, finding: "Structurally empty columns lead the ranking in many files: pilot of 60 random public files, 13 had a column at least half empty in 'What to fix first' and 3 had a 100% empty column (+40 pts). A fully empty column should be one 'drop this column' item, not a points-ranked fix", task: OPT}
    - {id: G15, finding: "Formula-injection check treats a leading minus as formula-like: ISO 8601 durations such as -P1D (264 cells in pharmaversesdtm face_vaccine) are scored as validity failures worth +40 pts and pull the file to 'fair' (src/data/score.ts, suggestion.kind formula)", task: FMT}
    - {id: G16, finding: "Identifier columns read as PII again in the pilot: clinical USUBJID flagged Phone/TFN/ACN in 5 of 60 files; height, depth and survey-response columns flagged Phone. No true PII was found in the 60 files", task: "T1 and BENCH-PII"}
    - {id: N1, finding: "Type gating cliff: the inferred type decides which checks run. A 1-5 quantity column with 6% or more ERROR becomes a category and scores 100 with 0 failures; 12% junk still scores 100. More junk can raise the score", task: MEASURE}
    - {id: N2, finding: "Sampled counts shown as exact: type-conflict counts come from a 2,000-value sample but are scored against all rows (cafe Price Per Unit 420 ERROR cells reported as 59)", task: MEASURE}
    - {id: N3, finding: "Double counting: the same 411 ERROR cells in cafe Transaction Date fail both 'parses cleanly' and 'stored as Text'", task: MEASURE}
    - {id: N4, finding: "Four separate issue engines read the same profile: score.ts (Quality page), findings.ts qualityFindings (called only by tests), Advanced signals (bottom of page), toolbar chips", task: WIRE}
    - {id: N5, finding: "Detectors run where they make no sense: similarity clusters on birth dates (25 clusters), drift on files sorted by date, CSV-injection guard scored as validity (-P1D)", task: "SEM, QUICK"}
  pilot_60_files:
    method: "60 random text-heavy files from the public Rdatasets collection (seeded sample), loaded through the real file input, row/column/empty counts compared with pandas"
    result: "0 crashes, 0 console errors; rows and columns matched pandas on all 57 files pandas could read; the app also loaded 3 files pandas failed on (encoding); empty-cell counts never below pandas. 10 files had sensitive-data flags, all judged false by column name; 57 of 60 scored good."
    caveat: "These are mostly curated research datasets, so a 'good' score may be correct. A random pile measures false alarms, not misses."
  root_cause_layers:
    summary: "Verified by running the app's own modules in Node (scores match the browser exactly on 8 files) and by a controlled junk-injection experiment. Parsing is sound apart from three local bugs. The main cause is type inference (type decides which checks run; sampled counts; double counting) and profiling (no shared semantic type), plus wiring (detectors that never reach the score). Scoring policy and the page are downstream. Full write-up: turbofuzz-dq-root-cause.md."
    parsing: [G7 header-less fallback (parse/header-detect.ts), ERROR token (parse/null-tokens.ts), dd-Mon-yyyy not parsed (parse/dates.ts)]
    type_inference: [N1 type gating cliff, N2 sampled counts shown as exact, N3 double counting (parse/infer.ts, data/column.ts, data/suggestions.ts, data/score.ts)]
    profiling: [G1 identifier knowledge isolated in data/identifier.ts, G4 PII phone-before-date order and TFN checksum on dates (data/text-profile.ts), G5 whole-value PII only and no name hints, G8 masks on URL and names (data/mask-profile.ts), G15 formula guard scored as validity (data/formula.ts via score.ts), N5 similarity on dates, G11 plausible ranges, G10 mixed forms, G6 zeros as missing]
    wiring: [N4 four engines, G12 variants detected but not scored, G9 near-duplicates ignoring id (data/key-duplicates.ts unused for this)]
    scoring_and_page: [G2 band, G3 and G14 optional and empty columns, G13 page length]
  expected_page_behaviour_after_fixes:
    titanic: "Ticket: no convert-to-integer offer, no Phone flag. Cabin: score band capped, multi-cabin values like 'C23 C25' not an off-format issue. Name: possibly sensitive (Medium)."
    pima: "Header detected as missing; columns get names or a prompt to name them; zeros in Glucose, BloodPressure, SkinThickness, Insulin, BMI flagged as probable hidden missing (review), not a perfect score."
    chipotle: "item_price flagged as numbers stored as text with currency symbol and trailing space; choice_description not ranked first."
    dirty_cafe: "ERROR and UNKNOWN both recognised as placeholders; Transaction Date NOT flagged as Phone/TFN; ISO dates identified as dates."
    hr_pii: "email invalid 102; department spellings; salary currency text 575; DOB mixed formats; notes: embedded card and phone detected; full_name, DOB, salary flagged possibly sensitive; card_number blank not top fix; mobile never offered Convert to Number."
    coffee: "harvest_year mixed formats; altitude impossible values and units; lot_number not the top fix; altitude and ico_number not flagged as Phone/TFN."
    police: "name/address/lat-long possibly sensitive; geo_id not Phone/ABN; 3-part names not off-format; 'Unknown' and '-' placeholders already handled (keep)."
    gdpr: "picture (URL) and source excluded from format-mask checks; date M/D/YYYY recognised; 1970-01-01 sentinel dates flagged as probable placeholders; 16 near-duplicates ignoring id flagged."

