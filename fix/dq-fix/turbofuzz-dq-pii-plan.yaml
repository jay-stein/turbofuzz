      - "Optional columns still show their completeness but do not enter the points-gained ranking and do not drive the band cap; Completeness weight for them is reduced (document the factor)."
      - "Never describe a blank sensitive column (for example card_number) as a defect."
      - "A 100% empty column is reported once as 'Empty column: nothing to analyse. Drop it?' with a Drop column action; it never receives a points-gained claim and does not drive the band cap beyond one step."
    done_when: "HR card_number and notes, coffee lot_number, chipotle choice_description no longer lead the fix list; Titanic Cabin still appears because the user has not marked it optional (it is surfaced in the band reason instead); toggling updates the score and the Recipe."

  - id: SENT
    title: Sentinel and hidden-missing detection
    priority: P0
    depends_on: [T6]
    files_touched: [src/parse/null-tokens.ts (EXACT_NULLS lacks ERROR and similar), src/data/suggestions.ts (sentinel shapes: extend beyond TBC and all-zero dates), src/data/anomalies.ts, test/sentinels.test.ts]
    do:
      - "Extend the placeholder set (case-insensitive, trimmed): ERROR, N/A, NA, #N/A, NULL, NONE, NIL, UNKNOWN, UNSPECIFIED, TBD, ?, -, --, n.a., missing, and keep the user-editable list."
      - "Probable hidden-missing zeros: a numeric column where zero is impossible by name or domain (age, price, weight, glucose, blood pressure, skin thickness, insulin, BMI, moisture) and zero appears more than expected; report as 'review', never silently convert."
      - "Sentinel numbers (-1, 99, 999, 9999, 99999) and sentinel dates (1970-01-01, 1900-01-01, 9999-12-31, 2999-12-31) flagged as probable placeholders when they repeat far above the column's other values."
      - "Placeholders inside a numeric or date column (for example ERROR in Quantity) count as failing validity as well as missing, and the column is not silently treated as text."
    done_when: "Cafe ERROR (2,908 cells) recognised; Pima zeros flagged for Glucose, BloodPressure, SkinThickness, Insulin and BMI with counts; GDPR 1970-01-01 (15 rows) and price 0 (11) flagged for review; coffee moisture 0 (264) flagged for review; none of these change data without a preview."

  - id: HDR
    title: Header-row detection
    priority: P0
    depends_on: [T0]
    files_touched: [src/parse/header-detect.ts (scoring heuristics), src/worker/ingest.ts (hasHeaders handling), src/ui/app.ts, test/header-detect.test.ts]
    do:
      - "When every value in the first row is numeric (or matches the type of the rows below) and the next rows are the same types, treat the file as header-less: name columns col_1..col_N (or Column 1..) and show a dismissible notice 'No header row detected. Columns are named col_1..col_N. Use first row as header?' with a one-click switch."
      - "Conversely, a first row that is all text over typed numeric columns stays a header. Never silently consume a data row."
    done_when: "Pima loads 768 rows with generic names and the notice; titanic, penguins, tips, airquality still load as before; both directions covered by tests."

  - id: FMT
    title: Limit format-mask checks to columns where a dominant format is meaningful
    priority: P0
    depends_on: [T8]
    files_touched: [src/data/mask-profile.ts (pattern and offCount), src/worker/search.worker.ts (~line 2762 where the mask is attached), src/data/name-hints.ts, test/format-mask.test.ts]
    do:
      - "Skip the 'parses cleanly' mask check for URL columns, free text (long average length or high distinct ratio), file paths, and personal-name columns; for names, allow 3 or more tokens, initials, hyphens, apostrophes, particles and suffixes (Jr., III)."
